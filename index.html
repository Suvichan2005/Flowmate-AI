    <style>
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      /* Screen reader only class */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .sr-only:focus {
        position: absolute;
        width: auto;
        height: auto;
        padding: 1rem;
        margin: 0;
        overflow: visible;
        clip: auto;
        white-space: normal;
        background: #7c3aed;
        color: white;
        z-index: 9999;
        top: 0.5rem;
        left: 0.5rem;
        border-radius: 0.5rem;
      }
    </style>
